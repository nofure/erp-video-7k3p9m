const v = document.getElementById("v"), list = document.getElementById("list");
const mmss = (s) => { const t = Math.round(s); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
function show(i, play) {
  const m = D[i];
  [...list.children].forEach((b, k) => b.classList.toggle("on", k === i));
  v.innerHTML = '<source src="' + m.web + '" type="video/mp4">';
  v.load(); if (play) v.play().catch(() => {});
  document.getElementById("t").textContent = (i + 1) + ". " + m.title;
  document.getElementById("m").textContent = m.who + " ความยาว " + mmss(m.secs) + " นาที";
  document.getElementById("c").innerHTML = m.chapters.map((c) => '<button data-s="' + c.start + '"><b>' + mmss(c.start) + '</b>' + c.title.replace(/[<>&]/g, "") + '</button>').join("");
  try { localStorage.setItem("erp-video", String(i)); } catch (e) {}
}
list.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(Number(b.dataset.i), true); });
document.getElementById("c").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { v.currentTime = Number(b.dataset.s); v.play().catch(() => {}); } });
v.addEventListener("loadedmetadata", () => { for (const t of v.textTracks) t.mode = "showing"; });
